render()}else if(el.dataset.project){filter=el.dataset.project;view='overview';render()}else if(el.dataset.task)taskForm(Number(el.dataset.task));else if(el.dataset.openproject){filter=el.dataset.openproject;view='board';render()}});$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});document.addEventListener('change',e=>{if(e.target.id==='filter'){filter=e.target.value;render()}});function exportJSON(auto=false){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='personal-hq-'+(auto?'automatic-':'')+'backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);$('#status').textContent=auto?'Automatic JSON backup requested. Check browser downloads.':'JSON backup download requested ✓';if(auto)localStorage.setItem(BACKUP_AT_KEY,String(Date.now()))}
function maybeAutoBackup(){if(!authUser||!cloudLoaded||cloudPending)return;const last=Number(localStorage.getItem(BACKUP_AT_KEY)||0);if(Date.now()-last>=BACKUP_INTERVAL)exportJSON(true)}
$('#export').onclick=()=>exportJSON(false);$('#import').onclick=()=>$('#file').click();$('#file').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>10000000)throw Error('File too large');const restored=JSON.parse(await file.text());validate(restored);if(!confirm('Restore this backup? It will replace all current projects and tasks. Export a backup first if you need the current data.'))return;const old=data;data=restored;if(!save()){data=old;throw Error('Browser storage is unavailable')}filter='all';view='overview';render();$('#status').textContent='Backup restored ✓'}catch(err){alert('Could not restore: '+err.message)}finally{e.target.value=''}};$('#reset').onclick=()=>{if(confirm('Reset all projects and tasks to the original samples? Export a backup first.')){update(()=>{data=seed();filter='all';view='overview'})}};
async function initCloud(){
 try{
  if(!window.supabase?.createClient)throw Error('Cloud library could not load');
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  const {data:sessionData}=await sb.auth.getSession();
  if(sessionData?.session?.user)await connectCloud(sessionData.session.user);
  sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){authUser=null;cloudLoaded=false;clearInterval(syncTimer);syncTimer=null;cloudError='';render()}else if(event==='SIGNED_IN'&&session?.user&&authUser?.id!==session.user.id){setTimeout(()=>connectCloud(session.user),0)}});
  render();
 }catch(e){cloudError='Cloud connection unavailable: '+e.message;renderCloudBar()}
}
async function connectCloud(user){
 authUser=user;cloudLoaded=false;cloudError='';renderCloudBar();
 try{
  const {data:row,error}=await sb.from('personal_hq_workspaces').select('data,updated_at').eq('user_id',user.id).maybeSingle();
  if(error)throw error;
  if(row){validate(row.data);data=row.data;localStorage.setItem(KEY,JSON.stringify(data));cloudLast=row.updated_at||'';cloudLoaded=true;cloudPending=false;render();maybeAutoBackup()}
  else{cloudLoaded=false;render();showMigration()}
  clearInterval(syncTimer);syncTimer=setInterval(()=>{if(cloudLoaded&&!cloudPending)pullCloud()},8000);
 }catch(e){cloudError='Could not load cloud data: '+e.message;render()}
}
function showMigration(){
 const el=$('#authpanel');if(!el)return;
 el.innerHTML='<div class="authpanel"><h2 style="margin:0 0 10px">Set up your cloud workspace</h2><p class="cloudmsg">No cloud workspace exists for this account yet. If your desktop has the latest tasks, open Personal HQ on that desktop and select <strong>Upload this device’s tasks</strong>. Do not initialize from your phone first.</p><button class="btn primary" id="migrateLocal">Upload this device’s tasks</button> <button class="btn" id="refreshCloud">Check for existing cloud data</button></div>';
 $('#migrateLocal').onclick=async()=>{if(!confirm('Upload the tasks currently stored in THIS browser as your cloud workspace? Only do this on the device with your latest tasks.'))return;cloudLoaded=true;cloudPending=true;renderCloudBar();await pushCloud();if(!cloudPending){render();maybeAutoBackup()}else{cloudLoaded=false;showMigration()}};
 $('#refreshCloud').onclick=()=>connectCloud(authUser);
}
function renderCloudBar(){
 const bar=$('#cloudbar'),panel=$('#authpanel');if(!bar||!panel)return;
 if(!sb){$('#sidebarAccount').innerHTML='';bar.innerHTML='<span class="small muted">Cloud sync is initializing… '+esc(cloudError)+'</span>';panel.innerHTML='';return}
 if(authUser){
  bar.innerHTML='<span class="small '+(cloudError?'cloudwarn':'cloudok')+'">'+esc(cloudError||(!cloudLoaded?'Cloud setup required':cloudPending?'Syncing…':'Cloud sync on ✓'))+'</span><button class="btn" id="syncNow">Sync now</button>';const account=$('#sidebarAccount');account.innerHTML='<div class="small muted">Signed in as</div><div class="small">'+esc(authUser.email||'')+'</div><button class="btn" id="signOut">Sign out</button>'; 
  $('#signOut').onclick=async()=>{await sb.auth.signOut();authUser=null;cloudLoaded=false;render()};
  $('#syncNow').onclick=async()=>{if(cloudLoaded){await writeChain;await pullCloud()}else connectCloud(authUser)};
  if(cloudLoaded)panel.innerHTML='';return;
 }
 $('#sidebarAccount').innerHTML='';bar.innerHTML='<span class="small muted">Sign in to sync projects across your devices</span>';
 panel.innerHTML='<div class="authpanel"><strong>Connect your Personal HQ</strong><p class="cloudmsg">Create an account or sign in using the same email and password on your phone and desktop. Use a NEW password, not your Supabase database password.</p><form class="form" id="cloudAuth"><label>Email<input class="field" type="email" name="email" required autocomplete="email"></label><label>Password<input class="field" type="password" name="password" minlength="6" required autocomplete="current-password"></label><div class="row"><button class="btn primary" type="submit" name="action" value="login">Sign in</button><button class="btn" type="submit" name="action" value="signup">Create account</button></div><p class="cloudmsg" id="authMessage"></p></form></div>';
 const form=$('#cloudAuth');form.addEventListener('click',e=>{const b=e.target.closest('button[name="action"]');if(b)form.dataset.action=b.value});
 form.onsubmit=async e=>{e.preventDefault();const f=new FormData(form),email=String(f.get('email')),password=String(f.get('password'));const action=form.dataset.action||'login';const msg=$('#authMessage');msg.textContent='Working…';
 try{const res=action==='signup'?await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}}):await sb.auth.signInWithPassword({email,password});if(res.error)throw res.error;msg.textContent=res.data.session?'Signed in. Loading workspace…':'Check your email to confirm your account, then return here and sign in.';if(res.data.session)await connectCloud(res.data.session.user)}catch(err){msg.textContent=err.message}};
}
function queueCloudSave(){
 cloudPending=true;const snapshot=JSON.parse(JSON.stringify(data));
 writeChain=writeChain.catch(()=>{}).then(async()=>{if(!authUser||!cloudLoaded)return;const {data:row,error}=await sb.from('personal_hq_workspaces').upsert({user_id:authUser.id,data:snapshot,updated_at:new Date().toISOString()},{onConflict:'user_id'}).select('updated_at').single();if(error)throw error;cloudLast=row.updated_at;cloudError='';}).catch(e=>{cloudError='Cloud save failed: '+e.message;cloudPending=true;renderCloudBar()});
 writeChain.then(()=>{if(!cloudError){cloudPending=false;$('#status').textContent='Saved to cloud ✓';renderCloudBar()}});
}
async function pushCloud(){if(!authUser)return;const {data:row,error}=await sb.from('personal_hq_workspaces').upsert({user_id:authUser.id,data,updated_at:new Date().toISOString()},{onConflict:'user_id'}).select('updated_at').single();if(error){cloudError=error.message;cloudPending=true}else{cloudLast=row.updated_at;cloudPending=false;cloudError='';cloudLoaded=true}renderCloudBar();if(cloudLoaded)maybeAutoBackup()}
async function pullCloud(){if(!authUser||!cloudLoaded||cloudPending)return;try{const {data:row,error}=await sb.from('personal_hq_workspaces').select('data,updated_at').eq('user_id',authUser.id).maybeSingle();if(error)throw error;if(row&&row.updated_at!==cloudLast){validate(row.data);data=row.data;cloudLast=row.updated_at;localStorage.setItem(KEY,JSON.stringify(data));render()}}catch(e){cloudError='Sync check failed: '+e.message;renderCloudBar()}}
function positionMobileFooter(){const app=document.querySelector('.app'),sidebar=document.querySelector('.sidebar'),backup=document.querySelector('.backup'),account=document.querySelector('#sidebarAccount');if(!app||!sidebar||!backup||!account)return;const mobile=window.matchMedia('(max-width:600px)').matches;if(mobile){app.appendChild(backup);app.appendChild(account)}else{sidebar.appendChild(backup);sidebar.appendChild(account)}}
window.addEventListener('resize',positionMobileFooter);positionMobileFooter();
if(!localStorage.getItem(KEY))save();render();initCloud();setInterval(maybeAutoBackup,60*60*1000)})();
</script></body></html>
